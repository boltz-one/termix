reqwest.workspace = true
ignore.workspace = true
fff-search.workspace = true

tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tracing-subscriber.workspace = true
termix-mcp.workspace = true
termix-harness = { workspace = true, features = ["installer-fixture"] }
# Paused-clock tests (the 30-minute idle reaper).
tokio = { workspace = true, features = ["test-util"] }
zip.workspace = true
tokio-tungstenite.workspace = true

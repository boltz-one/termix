[package]
name = "connection"
version = "0.1.0"
edition = "2021"

# ConPTY host plumbing: port `windows/src/cascadia/TerminalConnection`
# (ITerminalConnection + ConptyConnection) sang Rust native. Phase 1 = skeleton,
# FFI fill ở phase 2.

[dependencies]
# windows-rs 0.61 workspace dep thiếu `Win32_System_LibraryLoader` (cần cho dynamic
# load `ClearPseudoConsole` — port verbatim WT `GetProcAddress` pattern). Override
# workspace features bằng cách declare windows trực tiếp với feature đầy đủ.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct2D_Common",
] }
bitflags = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
crossbeam-channel = { workspace = true }

[dev-dependencies]
